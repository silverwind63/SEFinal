name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Python 版本由 .python-version 決定（3.12）；--locked 確保與 uv.lock 一致
      - run: uv sync --locked
      - run: uv run pytest -v
