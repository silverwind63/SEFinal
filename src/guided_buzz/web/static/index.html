<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課堂搶答系統｜老師</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header><h1>課堂搶答系統｜老師</h1><nav><a href="/teacher.html">搶答主控台</a> <button id="logout" hidden>登出</button></nav></header>
  <main>
    <section id="login-section">
      <h2>老師登入</h2>
      <form id="login-form">
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password" required maxlength="128">
        <button type="submit">登入</button>
      </form>
    </section>

    <div id="app" hidden>
      <section id="import-section">
        <h2>匯入學習單（Google Sheets）</h2>
        <form id="import-form">
          <label for="sheet-url">試算表網址</label>
          <input id="sheet-url" type="text" placeholder="https://docs.google.com/spreadsheets/d/…" required maxlength="2048">
          <button type="submit">匯入</button>
        </form>
        <p class="hint">學生請開啟 <code>/student.html</code> 並輸入組別代碼；搶答活動在「搶答主控台」建立。</p>
        <p class="hint">系統以 login-google 登入的 Google 帳號讀寫試算表，該帳號需要有這份學習單的編輯權限。</p>
        <div id="preview" hidden>
          <h3 id="preview-title"></h3>
          <p id="preview-summary"></p>
          <table>
            <thead><tr><th>系統題號</th><th>原題號</th><th>子題</th><th>工作表</th><th>儲存格</th><th>題組</th></tr></thead>
            <tbody id="preview-rows"></tbody>
          </table>
          <div class="actions">
            <button id="confirm-btn">確認</button>
            <button id="cancel-btn" class="secondary">取消</button>
          </div>
        </div>
      </section>

      <section id="results-section">
        <h2>寫回答案與匯出結果</h2>
        <p class="hint">活動結束後，把搶答成功的答案直接寫入原本 Google Sheets 的填空格；已有內容的格子不會被覆蓋。</p>
        <label for="activity-select">已結束的活動</label>
        <select id="activity-select"><option value="">（請選擇）</option></select>
        <button id="reload-activities" type="button" class="secondary">重新整理清單</button>
        <label for="writeback-worksheet">學習單 ID</label>
        <input id="writeback-worksheet" type="text" maxlength="64" placeholder="匯入後顯示的學習單 ID">
        <label for="activity-id">活動 ID</label>
        <input id="activity-id" type="text" maxlength="64" placeholder="搶答活動的 ID">
        <div class="actions">
          <button id="writeback-btn">寫回學習單</button>
          <button id="export-btn" class="secondary">匯出結果 CSV</button>
        </div>
      </section>
    </div>

    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
