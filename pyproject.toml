[project]
name = "guided-buzz"
version = "0.1.0"
description = "課堂搶答系統：Guided Notes 匯入、搶答活動、答案寫回"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guided_buzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
